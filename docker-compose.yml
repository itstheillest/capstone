version: '3.8'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: pixifai
      POSTGRES_USER: pixifai
      POSTGRES_PASSWORD: pixifaipassword
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - USE_POSTGRES=1
      - POSTGRES_HOST=db
      - POSTGRES_DB=pixifai
      - POSTGRES_USER=pixifai
      - POSTGRES_PASSWORD=pixifaipassword
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - db
      - redis

  celery:
    build: .
    command: celery -A pixifai worker -l info
    volumes:
      - .:/app
    environment:
      - USE_POSTGRES=1
      - POSTGRES_HOST=db
      - POSTGRES_DB=pixifai
      - POSTGRES_USER=pixifai
      - POSTGRES_PASSWORD=pixifaipassword
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - web
      - redis